# musksporkulübü.com — Nginx Konfigürasyonu
# Punycode: xn--musksporkulb-nlbb.com
#
# Kurulum:
#   sudo cp nginx.conf /etc/nginx/sites-available/musksporkulubu
#   sudo ln -s /etc/nginx/sites-available/musksporkulubu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name xn--musksporkulb-nlbb.com www.xn--musksporkulb-nlbb.com;

    # Certbot doğrulama dosyaları için istisna
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — ana sunucu
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--musksporkulb-nlbb.com www.xn--musksporkulb-nlbb.com;

    # SSL sertifikaları — certbot tarafından otomatik doldurulur
    ssl_certificate     /etc/letsencrypt/live/xn--musksporkulb-nlbb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--musksporkulb-nlbb.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # React build dosyaları
    root  /var/www/sporsite/dist;
    index index.html;

    # Güvenlik başlıkları
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Backend API proxy → Node.js port 3001
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # React SPA — tüm route'lar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik dosyalar için uzun cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
